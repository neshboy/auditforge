control_id: AF-WIN-ACCT-005
title: Account lockout duration is at least 15 minutes
description: >
  Once triggered, the account lockout stays in effect for a meaningful
  amount of time, slowing down automated password-guessing.
os: windows
applies_to: ["all"]
category: authentication
severity: medium
benchmark: "NIST SP 800-63B"
benchmark_version: "see docs/SOURCES.md for verified current revision"
external_reference: "https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/security-policy-settings"
rationale: >
  A very short lockout duration provides little throttling benefit against
  automated guessing; 15+ minutes is a widely used minimum baseline.
audit:
  primitive: win_secedit_policy
  params:
    key: LockoutDuration
expected_value: {"min": 15}
remediation:
  primitive: win_secedit_policy
  params:
    key: LockoutDuration
    value: 15
  reboot_required: false
  service_restart_required: false
possible_impact: "Locked-out users wait longer before automatic unlock."
frameworks:
  nist_800_53: ["AC-7"]
management_detection: false
high_impact: false
tags: ["authentication", "lockout"]
notes: "See AF-WIN-ACCT-004 notes on secedit/GPO attribution."
