control_id: AF-WIN-LOG-003
title: PowerShell operational log has adequate maximum size
description: >
  The Windows PowerShell operational log (which carries Script Block
  Logging events, if enabled per AF-WIN-PS-002) should have enough capacity
  to avoid wrapping quickly.
os: windows
applies_to: ["all"]
category: logging
severity: low
benchmark: "AuditForge Baseline"
benchmark_version: "0.1.0"
external_reference: "https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_logging_windows"
rationale: >
  Script Block Logging is only useful if the log capacity is large enough
  to retain events long enough to be reviewed or shipped to a SIEM.
audit:
  primitive: win_eventlog_config
  params:
    channel: "Windows PowerShell"
expected_value: {"min": 67108864}
remediation:
  primitive: win_eventlog_config
  params:
    channel: "Windows PowerShell"
    value: 67108864
  reboot_required: false
  service_restart_required: false
possible_impact: "Consumes more disk space for log storage (64 MB minimum here)."
frameworks:
  nist_800_53: ["AU-4", "AU-11"]
management_detection: false
high_impact: false
tags: ["logging", "powershell"]
notes: "67108864 bytes = 64 MiB."
