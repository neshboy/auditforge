control_id: AF-WIN-DEF-006
title: Defender behavior monitoring is enabled
description: >
  Behavior monitoring analyzes process behavior in real time to catch
  threats that evade static signature detection.
os: windows
applies_to: ["all"]
category: malware_protection
severity: high
benchmark: "Microsoft Security Baseline"
benchmark_version: "see docs/SOURCES.md"
external_reference: "https://learn.microsoft.com/en-us/defender-endpoint/configure-real-time-protection-microsoft-defender-antivirus"
rationale: >
  Verified current Microsoft guidance keeps behavior monitoring ON as part
  of the recommended real-time protection configuration.
audit:
  primitive: win_defender_preference
  params:
    pref_property: DisableBehaviorMonitoring
    invert: true
expected_value: true
remediation:
  primitive: win_defender_preference
  params:
    set_param: DisableBehaviorMonitoring
    invert: true
    value_type: bool
    value: true
  reboot_required: false
  service_restart_required: false
possible_impact: "None expected; matches Microsoft's own recommended configuration."
frameworks:
  nist_800_53: ["SI-3", "SI-4"]
management_detection: false
high_impact: false
tags: ["malware-protection", "defender"]
notes: ""
