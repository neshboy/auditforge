control_id: AF-LNX-SVC-009
title: firewalld is active (RHEL-family)
description: >
  On RHEL/Rocky/AlmaLinux systems where firewalld is the installed
  firewall front-end, it should be active.
os: linux
applies_to: ["rhel", "rocky", "almalinux"]
category: firewall
severity: high
benchmark: "AuditForge Baseline"
benchmark_version: "0.1.0"
external_reference: "https://firewalld.org/documentation/"
rationale: >
  firewalld is the standard, zone-based firewall front-end on RHEL-family
  distributions. Enabling it starts the service with its existing/default
  zone configuration; AuditForge never modifies zone rules.
audit:
  primitive: linux_firewalld_status
  params: {}
expected_value: true
remediation:
  primitive: linux_firewalld_status
  params: {}
  reboot_required: false
  service_restart_required: false
possible_impact: >
  If this host relies on a hand-written iptables/nftables setup instead of
  firewalld, enabling firewalld on top could introduce a second, possibly
  conflicting filtering layer -- check AF-LNX-SVC-007 first.
frameworks:
  nist_800_53: ["SC-7"]
management_detection: false
high_impact: false
tags: ["firewall", "firewalld"]
notes: "Reports NOT_APPLICABLE if firewalld is not installed."
