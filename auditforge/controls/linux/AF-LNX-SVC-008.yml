control_id: AF-LNX-SVC-008
title: ufw is active (Ubuntu/Debian)
description: >
  On Ubuntu/Debian systems where ufw is the installed firewall front-end,
  it should be active.
os: linux
applies_to: ["ubuntu_22.04", "ubuntu_24.04", "debian_12", "debian_13"]
category: firewall
severity: high
benchmark: "AuditForge Baseline"
benchmark_version: "0.1.0"
external_reference: "https://help.ubuntu.com/community/UFW"
rationale: >
  ufw enabling applies Ubuntu's standard safe default (deny incoming,
  allow outgoing) without flushing or replacing any rules that were not
  already ufw-managed.
audit:
  primitive: linux_ufw_status
  params: {}
expected_value: true
remediation:
  primitive: linux_ufw_status
  params: {}
  reboot_required: false
  service_restart_required: false
possible_impact: >
  If this host relies on a hand-written iptables/nftables setup instead of
  ufw, enabling ufw on top could introduce a second, possibly conflicting
  filtering layer -- check AF-LNX-SVC-007 first.
frameworks:
  nist_800_53: ["SC-7"]
management_detection: false
high_impact: false
tags: ["firewall", "ufw"]
notes: "Reports NOT_APPLICABLE if ufw is not installed (e.g. a RHEL-family host, or an Ubuntu host that deliberately manages nftables/iptables directly)."
