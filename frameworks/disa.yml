licensing_note: >
  Every STIG below downloads anonymously with no login from
  dl.dod.cyber.mil. The exact printed distribution-statement text was NOT
  verified verbatim during research (public.cyber.mil rendered only an
  empty JS shell to the fetch tooling); the belief that STIGs are U.S.
  Government works outside U.S. copyright (17 U.S.C. Sec 105) is recorded
  as background knowledge, not a confirmed quote. AuditForge does not
  redistribute STIG content and does not yet map individual controls to
  specific STIG Vuln-ID/Rule-ID values (see docs/CONTROLS.md limitations)
  to avoid fabricating IDs that were not verified against the actual STIG
  XCCDF/SCAP content.
