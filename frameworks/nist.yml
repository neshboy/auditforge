    title: "SP 800-53 Rev. 5: Security and Privacy Controls for Information Systems and Organizations"
    version: "Revision 5 (catalog Release 5.2.0)"
    published: "2020-09 (Rev. 5); Release 5.2.0 patch 2025-08-27"
    url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
    status: CURRENT
    notes: "No Revision 6 exists or has been announced as of the last check. AuditForge references this by control-family/ID (e.g. AC-2, IA-5) as a control catalog to tailor, not a step-by-step guide."
  - id: nist_800_171
    title: "SP 800-171 Rev. 3: Protecting Controlled Unclassified Information in Nonfederal Systems and Organizations"
    version: "Revision 3"
    published: "2024-05-14"
    url: "https://csrc.nist.gov/pubs/sp/800/171/r3/final"
    status: CURRENT
    notes: "Realigned to the SP 800-53 Rev. 5 moderate baseline. Not yet wired into per-control frameworks mappings in v0.1 (roadmap item)."
  - id: nist_800_63b
    title: "SP 800-63B-4: Digital Identity Guidelines -- Authentication and Authenticator Management"
    version: "SP 800-63B-4 (supersedes the 2020-03-02 SP 800-63B)"
    published: "2025-07"
    url: "https://csrc.nist.gov/pubs/sp/800/63/b/4/final"
    status: CURRENT
    notes: >
      Verified by direct PDF read of Sec. 3.1.1.1-3.1.1.2: >=15 char minimum
      for single-factor passwords (>=8 if MFA), no forced composition
      rules, no forced periodic rotation, mandatory compromised-password
      blocklist screening. This is the primary basis for AuditForge's
      Windows/Linux password-policy controls (AF-WIN-ACCT-006/007/008).
  - id: nist_800_219
    title: "SP 800-219 Rev. 1: Automated Secure Configuration Guidance from the macOS Security Compliance Project (mSCP)"
    version: "Revision 1 (final); Revision 2 exists only as an Initial Public Draft"
    published: "2023-07-21 (Rev. 1); Rev. 2 draft comment period closed 2026-08-14, not yet final"
    url: "https://csrc.nist.gov/pubs/sp/800/219/r1/final"
    status: UPDATE_AVAILABLE
    notes: >
      IMPORTANT: this is specifically the macOS (mSCP) automated-baseline
      project, not a generic cross-OS guidance document -- it has no
      Windows or Linux content. A Rev. 2 draft exists but is not final.
  - id: nist_csf_2_0
    title: "NIST CSWP 29: The NIST Cybersecurity Framework (CSF) 2.0"
    version: "CSWP 29 (Final)"
    published: "2024-02-26"
    url: "https://csrc.nist.gov/pubs/cswp/29/the-nist-cybersecurity-framework-csf-20/final"
